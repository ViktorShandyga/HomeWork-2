<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game">
      <div class="player">
        <h2>Player 1:</h2>
        <div class="cards">
          <div class="card"><span>2♣</span></div>
          <div class="card red"><span>9♥</span></div>
          <div class="card red"><span>6♥</span></div>
          <div class="card red"><span>A♦</span></div>
          <div class="card"><span>Q♠</span></div>
          <div class="card"><span>J♣</span></div>
        </div>
      </div>

      <div class="player">
        <h2>Player 2:</h2>
        <div class="cards">
          <div class="card red"><span>3♥</span></div>
          <div class="card"><span>A♣</span></div>
          <div class="card"><span>10♣</span></div>
          <div class="card red"><span>K♦</span></div>
          <div class="card"><span>8♠</span></div>
          <div class="card red"><span>3♥</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
